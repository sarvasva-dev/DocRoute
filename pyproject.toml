[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docroute"
version = "1.0.0"
description = "DocRoute: Adaptive Document Intelligence Engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Sarvasva", email = "dev@example.com"}
]
dependencies = [
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.10",
    "opencv-python>=4.9.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9"
]

[project.scripts]
docroute = "docroute.cli.main:main"

[tool.setuptools]
packages = [
    "docroute",
    "docroute.core",
    "docroute.extractors",
    "docroute.ocr",
    "docroute.routing",
    "docroute.provenance",
    "docroute.models",
    "docroute.api",
    "docroute.cli"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
